name: ecommerce

# Host port convention for per-service infrastructure:
#   Postgres: 54NN   Redis: 63NN   (NN = service number)
#   01 = identity   02 = catalog

services:
  # ── identity ──────────────────────────────────────────────
  identity-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: identity
      POSTGRES_USER: ${IDENTITY_DB_USER}
      POSTGRES_PASSWORD: ${IDENTITY_DB_PASSWORD}
    ports:
      - '5401:5432'
    volumes:
      - identity-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  identity-redis:
    image: redis:8.6-alpine
    ports:
      - '6301:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── catalog ───────────────────────────────────────────────
  catalog-db:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: catalog
      POSTGRES_USER: ${CATALOG_DB_USER}
      POSTGRES_PASSWORD: ${CATALOG_DB_PASSWORD}
    ports:
      - '5402:5432'
    volumes:
      - catalog-db-data:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 3s
      retries: 10

  catalog-redis:
    image: redis:8.6-alpine
    ports:
      - '6302:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── shared platform (emulates managed cloud services) ─────
  floci:
    image: floci/floci:2.3.0
    environment:
      FLOCI_DEFAULT_REGION: us-east-1
      # State survives restarts; it is kept in the floci-data volume.
      FLOCI_STORAGE_MODE: persistent
      FLOCI_STORAGE_PERSISTENT_PATH: /app/data
      # The console runs as its own service below, not as a sidecar Floci spawns outside Compose.
      FLOCI_SERVICES_UI_ENABLED: 'false'
      # Lambda containers join this network, so functions reach Mailpit (and others) by name.
      FLOCI_SERVICES_LAMBDA_DOCKER_NETWORK: ecommerce_default
    ports:
      - '4566:4566'
    volumes:
      - floci-data:/app/data
      # Lambda functions run as sibling containers, so Floci needs the Docker socket.
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      # The image ships no curl; this bundled script probes the port with bash /dev/tcp.
      test: ['CMD', '/usr/local/bin/healthcheck.sh']
      interval: 5s
      timeout: 3s
      retries: 20

  floci-ui:
    image: floci/floci-ui:0.7.0
    environment:
      PORT: '4500'
      FLOCI_ENDPOINT: http://floci:4566
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
    ports:
      - '4500:4500' # web console
    depends_on:
      floci:
        condition: service_healthy
    healthcheck:
      # A real API route: unknown paths fall back to the SPA's index.html with a 200.
      test:
        ['CMD', 'wget', '-q', '-O', '/dev/null', 'http://localhost:4500/api/clouds/aws/services']
      interval: 5s
      timeout: 3s
      retries: 10

  # ── tools (run on demand: pnpm infra:tf <command>) ────────
  terraform:
    image: hashicorp/terraform:1.17.0
    profiles: ['tools']
    # The whole repo is mounted so the Lambda bundle under functions/ can be zipped.
    working_dir: /repo/infra/terraform
    volumes:
      - ../..:/repo
    depends_on:
      floci:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # web UI
    healthcheck:
      test: ['CMD', '/mailpit', 'readyz']
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  identity-db-data:
  catalog-db-data:
  floci-data:
